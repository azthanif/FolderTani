<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#174b38" />
    <title>Temu Tani • Admin</title>
    <link rel="icon" type="image/png" href="../assets/logo-temutani-bg-white.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body data-role="admin">
    <!-- Struktur utama dashboard -->
    <div class="app">
        <div class="mobile-overlay" id="overlay" onclick="closeSide()"></div>

        <!-- Sidebar dan navigasi -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-logo">
                    <img
                        src="../assets/logo-temutani-bg-white.png"
                        alt="Logo TemuTani"
                    />
                </div>
                <div>
                    <div class="brand-name">
                        TemuTani<span style="color:#b9de91"></span>
                    </div>
                    <div class="brand-small">
                        Administrator
                    </div>
                </div>
            </div>

            <div class="nav-label">
                MENU UTAMA
            </div>
            <div class="nav-items" id="nav"></div>

            <div class="side-bottom">
                <a class="side-panel" href="../Chatbot/chatbot.html?from=admin" title="Simulasi chatbot WhatsApp"><div class="panel-icon"><img src="../assets/logo-wa.jpg" alt="WhatsApp"></div><div><h4>Alur WhatsApp</h4><p>Simulasi chatbot Temu Tani</p></div></a>

                <a class="side-footer" href="../index.html" title="Keluar ke halaman utama" aria-label="Keluar ke halaman utama">
                    <div class="avatar">A1</div>
                    <div>
                        <strong>Admin 1</strong>
                    <!-- <small>Temu Tani · Demo</small> -->
                    </div>
                    <svg class="logout-ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 17l5-5-5-5M20 12H9M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7"/></svg>
                </a>
            </div>
        </aside>

        <!-- Konten halaman -->
        <div class="main">
            <header class="topbar">
                <div style="display:flex;align-items:center;gap:15px">
                    <button class="icon-btn hamburger" title="Buka menu" onclick="toggleSide()" id="menuToggle"></button>
                    <div class="breadcrumbs">
                        <span>Dashboard Temu Tani</span>
                        <span>/</span>
                        <span class="current" id="crumb">Overview</span>
                    </div>
                </div>

                <div class="topactions">
                    <label class="global-search" id="globalSearch"></label>
                    <button class="icon-btn" onclick="showNotifications()" id="notifBtn" title="Notifikasi">
                        <span class="notification-dot"></span>
                    </button>
                    <div class="top-separator"></div>
                    <div class="top-profile">
                        <div class="avatar" style="height:33px;width:33px">A1</div>
                        <div>
                            <strong>Admin 1</strong>
                        </div>
                    </div>
                </div>
            </header>

            <main class="content" id="content"></main>
        </div>
    </div>

    <!-- Modal dan notifikasi -->
    <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
        <div class="modal" id="modal"></div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="../app.js" defer></script>
</body>
</html>
