<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#174b38" />
    <title>Temu Tani — Dashboard Admin</title>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");
        :root {
            --dark: #153d30;
            --dark2: #20543d;
            --green: #2a815c;
            --green2: #23815c;
            --lime: #ddf3b9;
            --mint: #e7f3eb;
            --bg: #f5f7f5;
            --card: #fff;
            --ink: #19352b;
            --text: #45554e;
            --muted: #89968f;
            --line: #e7ebe7;
            --amber: #b97e29;
            --amberbg: #fff4df;
            --red: #c45b54;
            --redbg: #fff0ed;
            --shadow: 0 4px 22px rgba(26,57,37,.045);
        }
        * {
            box-sizing: border-box;
        }
        html,body {
            margin: 0;
            min-height: 100%;
            font-family: "DM Sans",system-ui,sans-serif;
            background: var(--bg);
            color: var(--ink);
        }
        button,input,select {
            font: inherit;
        }
        button {
            cursor: pointer;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: .6;
        }
        a {
            color: inherit;
        }
        .app {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 258px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            background: #173e30;
            color: #e2f0e4;
            z-index: 20;
            display: flex;
            flex-direction: column;
            padding: 28px 17px 20px;
            overflow: auto;
            scrollbar-width: thin;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 10px 34px;
        }
        .brand-logo {
            width: 41px;
            height: 41px;
            background: #d9f0bb;
            border-radius: 13px;
            display: grid;
            place-items: center;
            color: #236342;
            transform: rotate(-4deg);
        }
        .brand-name {
            font-family: "Plus Jakarta Sans";
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.8px;
            color: white;
            line-height: 1.18;
        }
        .brand-small {
            font-size: 10px;
            letter-spacing: 1.1px;
            color: #adcabb;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .nav-label {
            font-size: 10px;
            letter-spacing: 1.6px;
            color: #8faf9c;
            text-transform: uppercase;
            font-weight: 800;
            margin: 10px 15px 12px;
        }
        .nav-items {
            display: grid;
            gap: 5px;
        }
        .nav-link {
            border: 0;
            color: #b7d0c1;
            background: transparent;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 12px 13px;
            border-radius: 11px;
            text-align: left;
            font-size: 13px;
            font-weight: 700;
            transition: all .2s;
            width: 100%;
        }
        .nav-link:hover {
            background: #24523e;
            color: #fff;
        }
        .nav-link.active {
            background: #d9f1be;
            color: #1d4a33;
            box-shadow: 0 3px 9px rgba(0,0,0,.06);
        }
        .nav-link svg {
            flex-shrink: 0;
        }
        .nav-link .nav-count {
            margin-left: auto;
            background: #f9e2a0;
            border-radius: 7px;
            padding: 3px 7px;
            color: #4f3c13;
            font-size: 11px;
        }
        .side-bottom {
            margin-top: auto;
            padding-top: 36px;
        }
        .side-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #275840;
            border: 1px solid #37684e;
            border-radius: 15px;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }
        .side-panel:after {
            content: "";
            position: absolute;
            width: 110px;
            height: 110px;
            border: 19px solid #366e4e;
            border-radius: 100%;
            right: -60px;
            top: -55px;
            opacity: .7;
        }
        .side-panel>* {
            position: relative;
            z-index: 1;
        }
        .side-panel .panel-icon {
            width: 33px;
            height: 33px;
            border-radius: 10px;
            background: #417b59;
            display: grid;
            place-items: center;
            margin-bottom: 0;
            flex-shrink: 0;
        }
        .side-panel h4 {
            font-size: 12px;
            color: white;
            margin: 0;
            font-weight: 700;
            line-height: 1.4;
        }
        .side-panel p {
            font-size: 11px;
            color: #c6dcca;
            line-height: 1.55;
            margin: 0;
        }
        .side-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 19px 7px 0;
        }
        .avatar {
            height: 36px;
            width: 36px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #d8efcb;
            color: #28513b;
            font-size: 12px;
            font-weight: 800;
        }
        .side-footer strong {
            font-size: 12px;
            color: #f3fcf5;
        }
        .side-footer small {
            display: block;
            font-size: 10px;
            color: #aec9b6;
            margin-top: 3px;
        }
        .main {
            margin-left: 258px;
            width: calc(100% - 258px);
            min-width: 0;
        }
        .topbar {
            height: 77px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 0 38px;
            border-bottom: 1px solid var(--line);
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #9ca6a0;
            font-size: 12px;
            font-weight: 700;
        }
        .breadcrumbs .current {
            color: var(--ink);
        }
        .topactions {
            display: flex;
            align-items: center;
            gap: 13px;
        }
        .global-search {
            display: none
        }
        .global-search input {
            width: 100%;
            border: 0;
            outline: 0;
            background: transparent;
            padding: 10px 0;
            font-size: 12px;
            color: #24372e;
        }
        .icon-btn {
            height: 36px;
            width: 36px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 10px;
            position: relative;
            color: #55665d;
        }
        .icon-btn:hover {
            background: #f4f8f4;
        }
        .notification-dot {
            position: absolute;
            right: 6px;
            top: 6px;
            width: 7px;
            height: 7px;
            background: #e6a84a;
            border-radius: 50%;
            border: 1px solid white;
        }
        .top-separator {
            height: 29px;
            width: 1px;
            background: var(--line);
        }
        .top-profile {
            display: flex;
            gap: 9px;
            align-items: center;
        }
        .top-profile strong {
            font-size: 12px;
            display: block;
        }
        .top-profile small {
            font-size: 10px;
            color: var(--muted);
            display: block;
            margin-top: 3px;
        }
        .content {
            padding: 32px 38px 58px;
            max-width: 1700px;
            margin: 0 auto;
        }
        .page-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 24px;
        }
        .overline {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            font-weight: 800;
            color: var(--green);
            margin-bottom: 9px;
        }
        .page-heading h1 {
            font-family: "Plus Jakarta Sans";
            font-size: 27px;
            letter-spacing: -1.2px;
            margin: 0 0 9px;
            font-weight: 800;
            color: #193b2c;
        }
        .page-heading p {
            color: #839088;
            font-size: 13px;
            margin: 0;
            line-height: 1.65;
        }
        .action-row {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
        }
        .btn {
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 10px;
            padding: 10px 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 750;
            color: #405348;
            font-size: 12px;
            white-space: nowrap;
        }
        .btn:hover {
            border-color: #bdd4c5;
            background: #f8fbf8;
        }
        .btn.primary {
            background: #245e44;
            color: #fff;
            border-color: #245e44;
        }
        .btn.primary:hover {
            background: #1b4d37;
        }
        .btn.tiny {
            padding: 7px 10px;
            font-size: 11px;
        }
        .select {
            border: 1px solid var(--line);
            background: white;
            border-radius: 10px;
            outline: 0;
            padding: 10px 13px;
            color: #40534a;
            font-weight: 700;
            font-size: 12px;
            max-width: 200px;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4,minmax(0,1fr));
            gap: 16px;
            margin-bottom: 18px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 17px;
            box-shadow: var(--shadow);
            min-width: 0;
        }
        .kpi {
            padding: 21px 20px 18px;
        }
        .kpi-top {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            margin-bottom: 20px;
        }

        .kpi-icon {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 12px;
            display: grid;
            place-items: center;
        }

        .kpi-name {
            font-size: 13px;
            font-weight: 700;
            color: #7b8b80;
            line-height: 1.5;
        }
        .kpi-icon.green {
            background: #e5f2e9;
            color: #267a54;
        }
        .kpi-icon.lime {
            background: #eff6df;
            color: #648e35;
        }
        .kpi-icon.gold {
            background: #fff4e1;
            color: #b58132;
        }
        .kpi-icon.blue {
            background: #eaf1fa;
            color: #5679a6;
        }
        .kpi-value {
            font-family: "Plus Jakarta Sans";
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -.7px;
            margin-top: 7px;
            color: #203a2d;
        }
        .kpi-unit {
            font-size: 13px;
            font-weight: 700;
            color: #6a7d70;
        }
        .kpi-foot {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #91a098;
            font-size: 10px;
            margin-top: 11px;
            line-height: 1.5;
        }
        .section-grid {
            display: grid;
            grid-template-columns: minmax(0,1.6fr) minmax(300px,1fr);
            gap: 18px;
            margin-bottom: 18px;
        }
        .section-grid.bottom {
            grid-template-columns: minmax(0,1.6fr) minmax(290px,1fr);
        }
        .section-card {
            padding: 23px 23px 21px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 17px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 800;
            font-family: "Plus Jakarta Sans";
            letter-spacing: -.3px;
            margin: 0;
        }
        .section-subtitle {
            font-size: 11px;
            color: #9ba59f;
            margin-top: 6px;
        }
        .pill {
            font-size: 10px;
            font-weight: 800;
            padding: 6px 9px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .pill.green {
            background: #e9f7ed;
            color: #2e8259;
        }
        .pill.gold {
            background: #fff3da;
            color: #9e7229;
        }
        .pill.red {
            background: #ffece8;
            color: #b35b50;
        }
        .pill.blue {
            background: #eaf3ff;
            color: #4776b2;
        }
        .pill.gray {
            background: #f1f4f1;
            color: #728178;
        }
        .price-summary {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 5px;
        }
        .big-price {
            font-family: "Plus Jakarta Sans";
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .delta {
            color: #288657;
            background: #eaf8ee;
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
        }
        .hint {
            font-size: 11px;
            color: #93a099;
        }
        .legend {
            display: flex;
            align-items: center;
            gap: 17px;
            flex-wrap: wrap;
            margin-top: 1px;
        }
        .legend-item {
            font-size: 10px;
            color: #75877b;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .legend-line {
            display: inline-block;
            width: 17px;
            height: 3px;
            border-radius: 3px;
        }
        .line-chart {
            width: 100%;
            height: 218px;
            margin-top: 4px;
            display: block;
        }
        .line-chart text {
            font: 11px "DM Sans",sans-serif;
            fill: #9ba69e;
        }
        .line-chart .gridline {
            stroke: #eff2ee;
            stroke-dasharray: 4 6;
        }
        .line-chart .curve {
            fill: none;
            stroke-width: 3.1;
            stroke-linejoin: round;
            stroke-linecap: round;
        }
        .line-chart .dot {
            stroke: white;
            stroke-width: 2;
        }
        .area-selector {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .seg {
            border: 1px solid var(--line);
            padding: 6px 10px;
            border-radius: 8px;
            background: #fff;
            color: #8a978e;
            font-size: 10px;
            font-weight: 800;
        }
        .seg.active {
            color: #235b42;
            background: #eaf5e8;
            border-color: #eaf5e8;
        }
        .region-item {
            margin: 15px 0 17px;
        }
        .region-item:last-child {
            margin-bottom: 0;
        }
        .region-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 750;
            color: #405448;
            margin-bottom: 8px;
        }
        .region-line span:last-child {
            color: #53675b;
        }
        .progress {
            background: #edf2ed;
            border-radius: 40px;
            height: 8px;
            overflow: hidden;
        }
        .progress-bar {
            background: #71b289;
            border-radius: 40px;
            height: 100%;
        }
        .progress-bar.alt {
            background: #b9d99f;
        }
        .progress-bar.gold {
            background: #e5bc74;
        }
        .divider {
            height: 1px;
            background: var(--line);
            margin: 20px 0;
        }
        .tiny-stats {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }
        .tiny-stats strong {
            font-size: 16px;
            font-weight: 800;
            display: block;
        }
        .tiny-stats small {
            font-size: 10px;
            color: var(--muted);
        }
        .table-wrap {
            overflow: auto;
            border-radius: 0 0 14px 14px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            text-align: left;
        }
        thead th {
            font-size: 10px;
            letter-spacing: .2px;
            font-weight: 800;
            color: #98a49b;
            padding: 12px 13px;
            background: #fafbfa;
            border-bottom: 1px solid #ecf0ec;
            white-space: nowrap;
        }
        tbody td {
            font-size: 12px;
            color: #46564c;
            padding: 14px 13px;
            border-bottom: 1px solid #f0f2f0;
            vertical-align: middle;
            white-space: nowrap;
        }
        tbody tr:hover {
            background: #fbfcfa;
        }
        tbody tr:last-child td {
            border-bottom: 0;
        }
        .table-card {
            overflow: hidden;
        }
        .table-card .section-header {
            padding: 23px 23px 14px;
            margin: 0;
        }
        .person-cell {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .initial-avatar {
            height: 30px;
            width: 30px;
            flex-shrink: 0;
            border-radius: 10px;
            background: #e8f1e6;
            display: grid;
            place-items: center;
            color: #477653;
            font-size: 10px;
            font-weight: 900;
        }
        .person-cell strong {
            font-weight: 800;
            color: #2b4336;
        }
        .person-cell small {
            font-size: 10px;
            display: block;
            margin-top: 3px;
            color: #9eaaa0;
        }
        .link-btn {
            color: #28774e;
            background: none;
            border: none;
            font-size: 11px;
            font-weight: 800;
            padding: 5px;
        }
        .link-btn:hover {
            text-decoration: underline;
        }
        .rows-footer {
            padding: 13px 22px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            color: #8b9b90;
            align-items: center;
            font-size: 11px;
        }
        .activity {
            display: flex;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid #f0f1ef;
        }
        .activity:last-child {
            border: 0;
        }
        .activity-icon {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #eff5eb;
            display: grid;
            place-items: center;
            color: #43875c;
        }
        .activity strong {
            font-size: 11px;
            line-height: 1.5;
            display: block;
            color: #354c3d;
        }
        .activity p {
            font-size: 10px;
            margin: 3px 0 0;
            line-height: 1.6;
            color: #9aa59e;
        }
        .info-strip {
            background: #edf6eb;
            border: 1px solid #dbe9d6;
            border-radius: 12px;
            padding: 13px 17px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: #51795e;
            font-size: 11px;
            line-height: 1.6;
            margin: 0 0 22px;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .toolbar .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            padding: 0 12px;
            color: #96a49a;
            min-width: 260px;
            flex: 1;
            max-width: 370px;
        }
        .search-box input {
            border: 0;
            background: transparent;
            outline: 0;
            font-size: 12px;
            width: 100%;
            height: 40px;
        }
        .toolbar select {
            min-width: 140px;
        }
        .table-card.wide {
            width: 100%;
        }
        .page-banner {
            background: linear-gradient(120deg,#1e6447,#2f7855);
            border: 0;
            color: white;
            padding: 24px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .page-banner:before,.page-banner:after {
            content: "";
            position: absolute;
            border: 1px solid rgba(255,255,255,.12);
            width: 230px;
            height: 230px;
            border-radius: 50%;
            right: -48px;
            top: -100px;
        }
        .page-banner:after {
            width: 140px;
            height: 140px;
            right: 30px;
            top: 60px;
        }
        .page-banner>* {
            z-index: 1;
        }
        .page-banner strong {
            font-family: "Plus Jakarta Sans";
            font-size: 17px;
            display: block;
        }
        .page-banner p {
            font-size: 11px;
            color: #d6e7d7;
            line-height: 1.6;
            margin: 8px 0 0;
        }
        .badge-light {
            padding: 8px 11px;
            background: #ffffff22;
            border-radius: 10px;
            color: #e9f7e9;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }
        .price-cards {
            display: grid;
            grid-template-columns: repeat(3,minmax(0,1fr));
            gap: 16px;
            margin-bottom: 18px;
        }
        .price-card {
            padding: 20px;
        }
        .price-card .c-label {
            font-size: 11px;
            font-weight: 800;
            color: #83948a;
        }
        .price-card strong {
            display: block;
            font-family: "Plus Jakarta Sans";
            font-size: 25px;
            letter-spacing: -.6px;
            margin: 12px 0 4px;
        }
        .price-card small {
            font-size: 10px;
            color: #98a49b;
        }
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 10px;
        }
        .weather-box {
            background: #f7faf7;
            padding: 14px;
            border-radius: 12px;
        }
        .weather-box strong {
            display: block;
            font-size: 13px;
            margin: 7px 0 3px;
        }
        .weather-box small {
            font-size: 10px;
            color: #91a097;
        }
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(12,31,22,.48);
            z-index: 50;
            align-items: center;

            color: #96a39a;
            font-weight: 800;

            margin-bottom: 7px;

        .modal-item strong {
            font-size: 13px;
            color: #2e4638;

        }
        .timeline {
            border-left: 2px solid #dce9de;
            margin: 18px 0 0 7px;
            padding: 0 0 0 21px;
        }
        .timeline-item {
            position: relative;
            margin: 0 0 21px;
        }
        .timeline-item:last-child {
            margin: 0;
        }
        .timeline-item:before {
            content: "";
            position: absolute;
            left: -27px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #74b587;
            border: 3px solid white;
            box-shadow: 0 0 0 2px #dce9de;

        .timeline-item strong {
            font-size: 11px;
            display: block;
        }
        .timeline-item small {
            color: #9ba69e;
            font-size: 10px;
            display: block;
            margin-top: 4px;
        }
        .modal-bottom {
            border-top: 1px solid var(--line);
            padding: 15px 26px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .toast {
            position: fixed;
            right: 24px;
            bottom: 25px;
            background: #183e2c;
            color: white;
            border-radius: 12px;

            gap: 9px;
            align-items: center;
            z-index: 80;
            opacity: 0;

            transition: .25s;

            opacity: 1;

        }
        .bar-chart {
            display: flex;

        .bar-col {

        }
        .bar-rect {

        }
        .small-muted {

        .mobile-overlay {

            }

            }
        }

                            </div>${ico('database', 19)}</div>
                        <div class="modal-grid">
                            <div class="modal-item">
                                <label>KABUPATEN</label><strong>${loc}</strong>
                            </div>
                            <div class="modal-item">
                                <label>JENIS GABAH</label><strong>GKP</strong>
                            </div>
                            <div class="modal-item">
                                <label>TANGGAL PREDIKSI</label><strong>31 Okt 2026</strong>
                            </div>
                            <div class="modal-item">
                                <label>SUMBER</label><strong>Model AI Temu Tani</strong>
                            </div>
                            <div class="modal-item">
                                <label>AKURASI (MAPE)</label><strong>Belum dievaluasi</strong>
                            </div>
                            <div class="modal-item">
                                <label>VERSI MODEL</label><strong>Belum tersedia</strong>
                            </div>
                        </div>
                        <div class="divider">
                        </div>
                        <div class="info-strip" style="margin:0">${ico('info', 16)}<span>Harga wajar adalah <strong>referensi negosiasi</strong>, bukan harga transaksi yang dijamin.</span>
                        </div>
                    </section>
                </div>
                <section class="card table-card">
                    <div class="section-header">
                        <div>
                            <h3 class="section-title">Perbandingan Harga per Wilayah</h3>
                            <div class="section-subtitle"> Output model dan selisih terhadap acuan HPP proposal · Data simulasi</div>
                        </div>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>KABUPATEN</th>
                                    <th>JENIS GABAH</th>
                                    <th>PREDIKSI AI</th>
                                    <th>HPP CONTOH</th>
                                    <th>SELISIH</th>
                                </tr>
                            </thead>
                            <tbody>${Object.entries(priceData).map(([city, v]) => `
                <tr>
                    <td>
                        <strong>${city}</strong>
                    </td>
                    <td>GKP</td>
                    <td>
                        <strong>${formatRupiah(v.current)}/kg</strong>
                    </td>
                    <td>${formatRupiah(6500)}/kg</td>
                    <td>
                        <span style="color:#29825c;font-weight:800">+${formatRupiah(v.current - 6500)}</span>
                    </td>
                </tr>
            `).join('')}</tbody>
                        </table>
                    </div>
                </section>
            `
        }
        // Terima tinggi aktual halaman berita dari iframe agar hanya dashboard yang scroll.
        window.addEventListener('message', function (event) {
            if (event.origin !== window.location.origin) return;
            const frame = document.getElementById('beritaFrame');
            if (!frame || event.source !== frame.contentWindow) return;
            if (event.data && event.data.type === 'berita-frame-height') {
                const height = Number(event.data.height);
                if (Number.isFinite(height) && height > 0) frame.style.height = height + 'px';
            }
        });

        function render() {
            document.getElementById('crumb').textContent = pages.find(p => p[0] === state.page)?.[2] || 'Overview';
            document.getElementById('nav').innerHTML = pages.map(([id, ic, label]) => `
                <button class="nav-link ${state.page === id ? 'active' : ''}" onclick="go('${id}')">${ico(ic, 18)}<span>${label}</span>${id === 'penawaran' && countOffers('Semua Wilayah') ? `
                <span class="nav-count">${countOffers('Semua Wilayah')}</span>
            ` : ''}</button>
            `).join('');
            document.getElementById('content').innerHTML = state.page === 'berita' ? `<iframe id="beritaFrame" src="../berita.html" title="Berita & Analisis" scrolling="no" style="display:block;width:100%;height:500px;overflow:hidden;border:0;background:#f5f7f5;"></iframe>` : state.page === 'overview' ? overview() : state.page === 'harga' ? hargaPage() : tablePage(state.page);
            updateTable()
        }
        function go(page) {
            state.page = page;
            state.query = '';
            state.status = 'Semua Status';
            state.type = 'Semua Jenis';
            state.area = 'Semua Wilayah';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            closeSide()
        }
        function setArea(area) {
            state.area = area;
            render()
        }
        function refreshDemo() {
            toast('Data demo ditampilkan ulang — tidak terhubung server.')
        }
        function toggleSide() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open')
        }
        function closeSide() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('open')
        }
        function showNotifications() {
            showModal('Notifikasi', 'Informasi terbaru', [
                'Ada ' + countOffers('Semua Wilayah') + ' penawaran yang menunggu respons atau penawaran balik.',
                'Saat sistem aktif, peristiwa ini akan dibaca dari database Temu Tani.'
            ].map(t => `
                <div class="activity">
                    <div class="activity-icon">${ico('bell', 16)}</div>
                    <div>
                        <strong>${t}</strong>
                    </div>
                </div>
            `).join(''))
        }
        function showModal(title, subtitle, body) {
            document.getElementById('modal').innerHTML = `
                <div class="modal-top">
                    <div>
                        <h2>${title}</h2>
                        <p>${subtitle}</p>
                    </div>
                    <button class="icon-btn" onclick="closeModal()" aria-label="Tutup">${ico('close', 18)}</button>
                </div>
                <div class="modal-body">${body}</div>
                <div class="modal-bottom">
                    <button class="btn" onclick="closeModal()">Tutup</button>
                </div>
            `;
            document.getElementById('modalBackdrop').classList.add('show')
        }
        function closeModal() {
            document.getElementById('modalBackdrop').classList.remove('show')
        }
        function detailsGrid(pairs) {
            return `
                <div class="modal-grid">${pairs.map(([k, v]) => `
                <div class="modal-item">
                    <label>${k}</label><strong>${v}</strong>
                </div>
            `).join('')}</div>
            `
        }
        function detail(type, id) {
            let x;
            if (type === 'stock') {
                x = stocks.find(s => s.id === id);
                showModal(`Detail Stok · ${id}`, 'Listing stok dari petani Maxxi Tani', detailsGrid([
                    ['NAMA PETANI', x.farmer],
                    ['KABUPATEN', x.location],
                    ['JENIS GABAH', x.type],
                    ['VOLUME', fmtNum(x.volume) + ' ton'],
                    ['WAKTU PANEN', x.harvest],
                    ['STATUS', badge(x.status)],
                    ['PENAWARAN MASUK', String(x.offers)],
                    ['SUMBER', 'Chatbot WhatsApp']
                ]) 
            )
            } else if (type === 'offer') {
                x = offers.find(o => o.id === id);
                showModal(`Detail Penawaran · ${id}`, 'Riwayat negosiasi tersimpan dari chatbot WhatsApp', detailsGrid([
                    ['PEMBELI', x.buyer + ' (guest)'],
                    ['PETANI', x.farmer],
                    ['STOK / VOLUME', x.stock + ' · ' + fmtNum(x.volume) + ' ton'],
                    ['KABUPATEN', x.location],
                    ['HARGA PENAWARAN', formatRupiah(x.price) + '/kg'],
                    ['HARGA REFERENSI AI', formatRupiah(x.ai) + '/kg'],
                    ['PENAWARAN BALIK', x.counter ? formatRupiah(x.counter) + '/kg' : '—'],
                    ['STATUS', badge(x.status)]
                ]) + `
                    <div class="divider">
                    </div><strong style="font-size:13px">Jejak Negosiasi</strong>
                    <div class="timeline">${x.history.map(y => `
                    <div class="timeline-item">
                        <strong>${y[0]}</strong><small>${y[1]} · ${y[2]}</small>
                    </div>
                `).join('')}</div>
                    <p class="small-muted">Persetujuan/penolakan dilakukan oleh petani lewat WhatsApp, bukan oleh admin.</p>
                `)
            } else if (type === 'transaction') {
                x = transactions.find(t => t.id === id);
                showModal(`Detail Kesepakatan · ${id}`, 'Catatan transaksi Temu Tani', detailsGrid([
                    ['PETANI', x.farmer],
                    ['PEMBELI', x.buyer],
                    ['KABUPATEN', x.location],
                    ['VOLUME', fmtNum(x.volume) + ' ton'],
                    ['HARGA AKHIR', formatRupiah(x.price) + '/kg'],
                    ['TOTAL NILAI', formatRupiah(x.price * x.volume * 1000)],
                    ['TANGGAL', x.date],
                    ['STATUS', badge(x.status)]
                ])
            )
            }
        }
        let toastTimer;
        function toast(msg) {
            let el = document.getElementById('toast');
            el.innerHTML = ico('check', 16) + msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 3800)
        }
        function exportCSV(which) {
            const rows = which === 'stok' ? stocks : which === 'penawaran' ? offers : which === 'transaksi' ? transactions : events;
            const data = rowFilter(rows);
            const keys = Object.keys(rows[0]).filter(k => k !== 'history');
            const csv = [keys.join(','), ...data.map(row => keys.map(k => '"' + String(row[k] ?? '').replace(/"/g, '""') + '"').join(','))].join('\r\n');
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
            const u = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = u;
            a.download = `temu-tani-${which}-simulasi.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(u);
            toast('CSV simulasi berhasil disiapkan.')
        }
        
        document.getElementById('notifBtn').insertAdjacentHTML('afterbegin', ico('bell', 17));
        document.getElementById('menuToggle').innerHTML = ico('menu', 20);
        document.getElementById('globalSearch').innerHTML = ico('search', 16) + `
            <input placeholder="Cari stok, pembeli, penawaran..." aria-label="Cari di halaman" oninput="globalQuery(this.value)"/>
        `;
        function globalQuery(q) {
            if (['stok', 'penawaran', 'transaksi', 'aktivitas'].includes(state.page)) {
                state.query = q;
                let s = document.getElementById('localSearch');
                if (s)
                    s.value = q;
                updateTable()
            } else if (q.trim()) {
                go('penawaran');
                state.query = q;
                render()
            }
        }
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape')
                closeModal()
        });
        render();
    </script>
</body>
</html>
