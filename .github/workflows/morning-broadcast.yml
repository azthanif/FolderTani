name: Siaran Pagi (Berita + Harga)

on:
  schedule:
    - cron: "57 23 * * *"   # 06:57 WIB, sama dengan cron eksternal. Workflow ini DISABLED: broadcast kini via n8n 07:00
  workflow_dispatch:
    inputs:
      date:
        description: "Tanggal siaran YYYY-MM-DD (kosong = hari ini WIB)"
        required: false
      dry_run:
        description: "true = dry-run (tidak kirim WA)"
        required: false
        default: "false"

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Cek secrets
        run: |
          missing=""
          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets belum diisi:$missing"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news_pipeline/requirements.txt

      - name: Instal dependensi
        run: pip install -r news_pipeline/requirements.txt

      - name: Kirim siaran pagi
        env:
          RUN_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--config news_pipeline/config.ci.yaml --from-step broadcast --to-step broadcast)
          if [ -n "$RUN_DATE" ]; then
            [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Format tanggal harus YYYY-MM-DD"; exit 1; }
            args+=(--date "$RUN_DATE")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python -m news_pipeline.run_daily "${args[@]}"
