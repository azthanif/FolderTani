# Pipeline berita harian: Media Cloud -> teks -> NER BERT -> wilayah -> ringkasan -> digest -> Supabase.
# Jalan otomatis 05.00 WIB (22.00 UTC hari sebelumnya), bisa juga dijalankan manual dari tab Actions.
# Butuh GitHub Secrets: MEDIACLOUD_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (opsional GROQ_API_KEY).
# Koleksi Media Cloud di news_pipeline/config.ci.yaml (34412392, Indonesia - National); bisa diganti lewat
# repository variable MEDIACLOUD_COLLECTION_IDS bila collection_ids di config dikosongkan.
name: Berita harian

on:
  schedule:
      - cron: "0 20 * * *"   # 03:00 WIB; broadcast jam 07:00 WIB (00:00 UTC), buffer 4 jam
  workflow_dispatch:
    inputs:
      date:
        description: "Tanggal run YYYY-MM-DD (kosong = hari ini WIB)"
        required: false
        default: ""
      from_step:
        description: "Mulai dari langkah"
        required: false
        default: geturl
        type: choice
        options: [geturl, gettext, preprocess, ner, classifier, summary, digest, publish, notify]

concurrency:
  group: news-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
      MEDIACLOUD_COLLECTION_IDS: ${{ vars.MEDIACLOUD_COLLECTION_IDS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}        # opsional: ringkasan AI; kosong = Lead-2
      WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }} 
      HF_HOME: ${{ github.workspace }}/.hf-cache
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Cek secrets
        run: |
          missing=""
          for v in MEDIACLOUD_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets belum diisi:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news_pipeline/requirements.txt

      - name: Instal dependensi (torch CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r news_pipeline/requirements.txt

      - name: Cache model Hugging Face
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ runner.os }}-bert-base-indonesian-NER-v1

      # Status lintas hari (dedup berita & boilerplate). Kunci unik per run, dipulihkan dari run terakhir.
      - name: Pulihkan status pipeline
        uses: actions/cache@v4
        with:
          path: news_pipeline/data/state
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-

      - name: Jalankan pipeline
        env:                       # input lewat env, bukan disisipkan ke skrip (cegah injeksi shell)
          RUN_DATE: ${{ inputs.date }}
          FROM_STEP: ${{ inputs.from_step || 'geturl' }}
        run: |
          args=(--config news_pipeline/config.ci.yaml --from-step "$FROM_STEP")
          if [ -n "$RUN_DATE" ]; then
            [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Format tanggal harus YYYY-MM-DD"; exit 1; }
            args+=(--date "$RUN_DATE" --force)
          fi
          python -m news_pipeline.run_daily "${args[@]}"

      - name: Simpan hasil run (untuk diperiksa bila gagal)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-run-${{ github.run_id }}
          path: |
            news_pipeline/data/runs/
          retention-days: 14
          if-no-files-found: ignore
