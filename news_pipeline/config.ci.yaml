# Konfigurasi pipeline untuk GitHub Actions (.github/workflows/news-daily.yml).
# Tidak berisi rahasia: API key & kredensial Supabase dibaca dari GitHub Secrets lewat variabel lingkungan.
run:
  data_dir: data
  lookback_days: 7          # indeks Media Cloud tertinggal beberapa hari (cerita terakhir koleksi 20 Nov saat diekspor 24 Nov);
                            # berita yang sudah diproses dibuang dedup lintas hari & upsert per URL di Supabase
  log_level: INFO

mediacloud:
  api_key_env: MEDIACLOUD_API_KEY
  collection_ids: [34412392]  # "Indonesia - National". Kosongkan untuk memakai variable MEDIACLOUD_COLLECTION_IDS
  max_per_query: 1000
  queries:
    Garut: '(padi OR gabah OR beras OR sawah OR "harga gabah" OR bulog OR "gagal panen" OR penggilingan) AND garut'
    Cianjur: '(padi OR gabah OR beras OR sawah OR "harga gabah" OR bulog OR "gagal panen" OR penggilingan) AND cianjur'
    Nasional: '("harga gabah" OR "harga beras" OR HPP OR bulog OR "pupuk subsidi") AND (petani OR pertanian)'

ner:
  model: cahya/bert-base-indonesian-NER
  device: -1                # runner GitHub tanpa GPU

summary:
  method: auto              # idT5 bila model_path diisi; selain itu LLM Groq bila secret GROQ_API_KEY ada; selain itu Lead-2
  model_path: ""
  llm:
    model: openai/gpt-oss-20b

digest:
  max_local: 2
  max_total: 2
  website_url: https://temutani-web.vercel.app/petani/berita
  llm:
    enabled: false          # tidak ada Ollama di runner

notify:
  enabled: true            # pipeline hanya simpan ke DB; pengiriman WA dilakukan morning-broadcast.yml (07:00 WIB)
  waha_url: https://waha.temutani.web.id
  api_key_env: WAHA_API_KEY
  session: "session_01m7yhrn721a4g9386vrvrhg5a"

storage:
  supabase:
    enabled: true           # hasil ditulis ke tabel news_articles & news_digests; web membaca lewat TEMUTANI_NEWS_SOURCE=supabase
    url_env: SUPABASE_URL
    key_env: SUPABASE_SERVICE_ROLE_KEY
